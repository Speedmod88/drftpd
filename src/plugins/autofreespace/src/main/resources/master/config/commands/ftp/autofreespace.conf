SITE DUPE2 {
plugin org.drftpd.autofreespace.master
class AutoFreeSpaceCommands
method doSITE_DUPE2
perms *
# Max release rows shown for one release-name/path lookup.
limit 50
# Max duplicate groups shown when argument is a section name.
section.limit 50
# When set to false it will only show publicly available paths, if true it will honor privpath rules.
# Default: [true]
observe.privpath true
help Shows duplicate release variants using AutoFreeSpace Dupe2 rules.
help.specific ${command} <release-name-or-path-or-section>
help.specific ${command} <release-name-or-path-or-section> -l <limit>
help.specific ${command} <release-name-or-path-or-section> -limit <limit>
}
